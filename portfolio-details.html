<!DOCTYPE html>
<html lang="fr">

<head>
	<meta charset="utf-8">
	<meta content="width=device-width, initial-scale=1.0" name="viewport">

	<title data-content="meta.title">Détails du Projet - Junior Brindou</title>
	<meta content="" name="description">
	<meta content="" name="keywords">

	<!-- Favicons -->
	<link href="assets/img/logo-jb-new.png" rel="icon" type="image/png">
	<link href="assets/img/logo-jb-new.png" rel="apple-touch-icon">

	<!-- Google Fonts -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap"
		rel="stylesheet">

	<!-- Vendor CSS Files -->
	<link href="assets/vendor/aos/aos.css" rel="stylesheet">
	<link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
	<link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
	<link href="assets/vendor/boxicons/css/boxicons.min.css" rel="stylesheet">
	<link href="assets/vendor/glightbox/css/glightbox.min.css" rel="stylesheet">
	<link href="assets/vendor/swiper/swiper-bundle.min.css" rel="stylesheet">

	<!-- Main CSS File -->
	<link href="assets/css/style.css" rel="stylesheet">
</head>

<body>

	<!-- ======= Page Loader ======= -->
	<div id="page-loader" class="page-loader">
		<div class="loader-terminal">
			<div class="loader-terminal-header">
				<span class="terminal-btn red"></span>
				<span class="terminal-btn yellow"></span>
				<span class="terminal-btn green"></span>
				<span class="terminal-title">junior@portfolio ~ %</span>
			</div>
			<div class="loader-terminal-body">
				<div class="loader-line">
					<span class="loader-prompt">$</span>
					<span class="loader-text">cat project_details.txt</span>
				</div>
				<div class="loader-progress">
					<div class="loader-progress-bar"></div>
				</div>
			</div>
		</div>
	</div>

	<!-- ======= Navigation Container (Reusable Component) ======= -->
	<div id="nav-wrapper"></div>

	<main id="main" class="project-details-page">

		<!-- Hero Banner with Swiper -->
		<section class="project-hero mt-0">
			<div class="project-hero-slider swiper">
				<div class="swiper-wrapper" id="project-gallery-container">
					<!-- Dynamically populated -->
					<div class="swiper-slide text-center d-flex align-items-center justify-content-center">
						<div class="spinner-border text-light" role="status"></div>
					</div>
				</div>
				<div class="swiper-pagination"></div>
				<div class="swiper-button-next"></div>
				<div class="swiper-button-prev"></div>
			</div>

			<div class="project-hero-content text-center">
				<div class="container" data-aos="fade-up">
					<span class="category-badge" id="project-category">---</span>
					<h1 id="project-full-title" class="display-4 fw-bold">Titre du projet</h1>
				</div>
			</div>
		</section>

		<!-- Info Section -->
		<section class="project-info-bar py-4 shadow-sm">
			<div class="container">
				<div class="row text-center gy-3" data-aos="fade-up" data-aos-delay="100">
					<div class="col-md-4">
						<i class="bx bx-buildings fs-1 project-accent-color"></i>
						<h5 class="mt-2 text-muted">Client</h5>
						<p id="project-client" class="fw-bold mb-0">---</p>
					</div>
					<div class="col-md-4">
						<i class="bx bx-calendar fs-1 project-accent-color"></i>
						<h5 class="mt-2 text-muted">Date</h5>
						<p id="project-date" class="fw-bold mb-0">---</p>
					</div>
					<div class="col-md-4">
						<i class="bx bx-link-external fs-1 project-accent-color"></i>
						<h5 class="mt-2 text-muted">Lien</h5>
						<p class="mb-0"><a href="#" id="project-url" target="_blank"
								class="fw-bold text-decoration-none project-accent-color">---</a></p>
					</div>
				</div>
			</div>
		</section>

		<!-- Description & Tech Stack -->
		<section class="project-details-content py-5">
			<div class="container">
				<div class="row gy-5">
					<div class="col-lg-8" data-aos="fade-right">
						<h2 class="section-heading mb-4 border-bottom pb-2">Aperçu du projet</h2>
						<p id="project-description" class="lead text-muted lh-lg">
							Chargement en cours...
						</p>
					</div>
					<div class="col-lg-4" data-aos="fade-left" data-aos-delay="100">
						<div class="tech-stack-card p-4 rounded-4 shadow-sm border" id="tech-stack-container"
							style="display:none;">
							<h3 class="h4 mb-4 project-accent-text"><i class="bx bx-code-alt me-2"></i>Technologies
								Utilisées</h3>
							<ul class="list-unstyled mb-0" id="project-tech-stack">
								<!-- Injected via JS -->
							</ul>
						</div>
					</div>
				</div>
			</div>
		</section>

		<!-- Benefits Section -->
		<section class="project-benefits py-5" id="benefits-section" style="display:none;">
			<div class="container" data-aos="fade-up">
				<div class="text-center mb-5">
					<h2 class="section-heading d-inline-block border-bottom pb-2 project-accent-text">Bénéfices & Impact
					</h2>
				</div>
				<div class="row gy-4 justify-content-center" id="project-benefits">
					<!-- Injected via JS -->
				</div>
			</div>
		</section>

	</main>

	<!-- ======= Footer ======= -->
	<footer id="footer">
		<div class="container">
			<div class="copyright" data-content="footer.copyright">
				<!-- Dynamically populated -->
			</div>
		</div>
	</footer>

	<a href="#" class="back-to-top d-flex align-items-center justify-content-center"><i
			class="bi bi-arrow-up-short"></i></a>

	<!-- Vendor JS Files -->
	<script src="assets/vendor/purecounter/purecounter_vanilla.js"></script>
	<script src="assets/vendor/aos/aos.js"></script>
	<script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
	<script src="assets/vendor/glightbox/js/glightbox.min.js"></script>
	<script src="assets/vendor/isotope-layout/isotope.pkgd.min.js"></script>
	<script src="assets/vendor/swiper/swiper-bundle.min.js"></script>
	<script src="assets/vendor/typed.js/typed.min.js"></script>
	<script src="assets/vendor/waypoints/noframework.waypoints.js"></script>

	<!-- Main JS File -->
	<script src="assets/js/main.js"></script>

</body>

</html>
