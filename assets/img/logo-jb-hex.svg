<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="50%" style="stop-color:#F5A623"/>
      <stop offset="100%" style="stop-color:#D4AF37"/>
    </linearGradient>
  </defs>
  
  <!-- Hexagon background -->
  <polygon points="50,3 93,28 93,72 50,97 7,72 7,28" fill="#0A0A0A" stroke="url(#grad1)" stroke-width="2"/>
  
  <!-- Terminal prompt style -->
  <text x="18" y="58" font-family="Fira Code, monospace" font-size="14" fill="#FFD700" font-weight="500">&gt;_</text>
  
  <!-- JB letters -->
  <text x="38" y="62" font-family="Inter, sans-serif" font-size="28" font-weight="800" fill="url(#grad1)">JB</text>
</svg>
